# ================================
# TechAssist AI - Backend Config
# ================================

spring.application.name=techassist-backend

# Server
server.port=8080

# ================================
# Database - PostgreSQL
# ================================
spring.datasource.url=jdbc:postgresql://localhost:5432/techassist_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ================================
# Logging
# ================================
logging.level.org.springframework.security=DEBUG
logging.level.com.techassist=DEBUG

app.jwt.secret=ISYHDVofDS+ncpNB9GTQB1F+kIcGPdtyiKz3Y2vJwAJDSziRl4X8sBoCgnKaeJdNN8HQV3yIg+WgN3IqMZnRdQ==
app.jwt.expiration=86400000

server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true




openrouter.api-key=${GOOGLE_AI_KEY}
openrouter.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
